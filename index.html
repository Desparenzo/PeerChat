<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>P2P Chat</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--gap:1.5in;--p:#17212b}
.kb{--gap:6px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e1621;color:#e8eef5;font:15px system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:50%;background:#2a3b4d}
#app{height:var(--vh,100dvh);display:flex;flex-direction:column}
#scan{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#6fa8e8}
.radar{width:min(70vw,320px);aspect-ratio:1;border-radius:50%;border:2px solid #2b7cd3;position:relative;overflow:hidden;background:repeating-radial-gradient(#0000 0 38px,#2b7cd344 39px 40px)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#2b7cd3cc,#0000 25%);animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#chat{flex:1;display:none;flex-direction:column;min-height:0}
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--p)}
.hd .t{flex:1;min-width:0}
select{width:100%;background:none;color:inherit;border:0;font:600 17px system-ui}
select option{color:#000}
.sub{font-size:12px;color:#8a9aa9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{width:42px;height:42px;font-size:19px;flex:none}
#msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:7px 10px;border-radius:12px;word-break:break-word;white-space:pre-wrap}
.me{align-self:flex-end;background:#2b5278}.ot{align-self:flex-start;background:#182533}
.b small{display:block;font-size:11px;opacity:.6}
.b img,.b video{max-width:100%;border-radius:8px;display:block;margin-bottom:4px}
.fb{display:flex;gap:6px;margin-top:4px}
.fb a{background:#0005;color:#fff;padding:4px 10px;border-radius:8px;text-decoration:none;font-size:13px}
#pg{flex:none;display:none;padding:6px 12px;background:var(--p);font-size:12px;color:#8a9aa9}
.pbar{height:5px;background:#0e1621;border-radius:3px;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#2b7cd3}
.cp{flex:none;display:flex;gap:6px;align-items:flex-end;padding:8px;margin-bottom:var(--gap);background:var(--p)}
.cp textarea{flex:1;max-height:110px;resize:none;border:0;border-radius:20px;padding:10px 14px;background:#0e1621;color:inherit;font:inherit}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000c;z-index:9}
.box{background:var(--p);padding:22px;border-radius:14px;display:flex;flex-direction:column;gap:12px;width:min(88vw,340px);text-align:center}
.box input{padding:10px;border-radius:8px;border:0;background:#0e1621;color:inherit;font:inherit}
.box button,.rb{border-radius:10px;padding:10px;background:#2b7cd3}
#call{background:#000;z-index:10;gap:0;justify-content:flex-start}
#grid{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:3px}
.tile{position:relative;background:#111;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover}
.nm{position:absolute;left:8px;bottom:8px;background:#0008;padding:2px 8px;border-radius:8px;font-size:13px}
#lv{position:absolute;top:10px;right:10px;width:90px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1px solid #fff4;background:#222}
.ctl{display:flex;gap:14px;align-items:center;justify-content:center;padding:14px 10px;margin-bottom:var(--gap);flex-wrap:wrap}
.ctl button{width:54px;height:54px;font-size:22px}
.ctl .on{background:#d33}
#bh{width:84px;height:84px;background:#e11;font-size:34px}
</style></head><body>
<div id="app">
 <div id="scan"><div class="radar"></div><div>Scanning…</div></div>
 <div id="chat">
  <div class="hd"><div class="t"><select id="sel"></select><div class="sub" id="sub"></div></div>
   <button class="ib" id="vc">📞</button><button class="ib" id="vv">🎥</button></div>
  <div id="msgs"></div>
  <div id="pg"><div></div><div class="pbar"><i></i></div></div>
  <div class="cp"><button class="ib" id="att">📎</button><textarea id="inp" rows="1" placeholder="Message"></textarea><button class="ib" id="snd" style="background:#2b7cd3">➤</button></div>
 </div>
</div>
<input type="file" id="fi" multiple hidden>
<div class="ov" id="nm"><div class="box"><b>Enter your name</b><input id="ni" maxlength="30" placeholder="Name"><button id="go">Start</button></div></div>
<div class="ov" id="ring"><div class="box"><b id="rt"></b><button id="ra">Accept</button><button id="rd" style="background:#d33">Deny</button></div></div>
<div class="ov" id="call"><div id="grid"></div><video id="lv" autoplay playsinline muted></video>
 <div class="ctl"><button id="bm">🎤</button><button id="bc">📷</button><button id="bf">🔄</button><button id="br">⏺</button><button id="bh">📞</button></div></div>
<script>
const CODE="#+__7284kwrufi28388(#)#)92273+-29393943473755+#892{¢{€{¥÷`°°|°•=√§^§¥}€{`[|==•×``×+2+#+$8_8&829298347474++2+#9$9$8'v6b6wiwijrhth94(4";
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=s=>s>1e6?(s/1e6).toFixed(1)+' MB':Math.ceil(s/1e3)+' KB';
let myName=localStorage.getItem('pc_name'),main,hubP,hubBusy,hubId,cur='g',peers={},pend={},files={},inc={},call=null,H=0,unread=new Set(),hist=[];
try{hist=JSON.parse(localStorage.getItem('pc_hist')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('pc_hist',JSON.stringify(hist.filter(m=>!m.f).slice(-500)))}catch(e){}};

/* ---------- viewport / keyboard ---------- */
const vv=window.visualViewport;
function fit(){const h=vv?vv.height:innerHeight;H=Math.max(H,innerHeight);document.documentElement.style.setProperty('--vh',h+'px');document.body.classList.toggle('kb',h<H-150);const m=$('msgs');m.scrollTop=m.scrollHeight}
vv&&vv.addEventListener('resize',fit);addEventListener('resize',fit);addEventListener('orientationchange',()=>{H=0;setTimeout(fit,300)});fit();

/* ---------- discovery: claim hub id or join it, retried until connected ---------- */
async function start(){
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(CODE)));
 hubId='pc'+[...h].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('');
 main=new Peer({config:ICE});
 main.on('open',loop);main.on('connection',setup);main.on('call',onCall);
 main.on('disconnected',()=>{try{main.reconnect()}catch(e){}});
 main.on('error',()=>{});
}
function loop(){tryHub();if(!Object.keys(peers).length&&hubP)join(0);setTimeout(loop,1000+Math.random()*3000)}
function tryHub(){
 if(hubP||hubBusy)return;hubBusy=1;
 const p=new Peer(hubId,{config:ICE});
 p.on('open',()=>{hubP=p;hubBusy=0});
 p.on('connection',c=>c.on('open',()=>c.send({t:'list',l:[main.id,...Object.keys(peers)]})));
 p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
 p.on('close',()=>{if(hubP===p)hubP=null;hubBusy=0});
 p.on('error',e=>{hubBusy=0;if(e.type==='unavailable-id'){p.destroy();if(!Object.keys(peers).length)join()}else if(!p.open)p.destroy()});
}
function join(){
 const c=main.connect(hubId);
 c.on('data',d=>{if(d.t==='list')d.l.forEach(connect);c.close()});
 setTimeout(()=>{if(!c.open)c.close()},6000);
}
function connect(id){if(id===main.id||peers[id]||pend[id])return;pend[id]=1;setup(main.connect(id,{reliable:true}))}
function setup(c){
 c.on('open',()=>{delete pend[c.peer];if(peers[c.peer]){c.close();return}peers[c.peer]={c,name:'…'};c.send({t:'hi',name:myName});render()});
 c.on('data',d=>onData(c,d));
 const x=()=>{delete pend[c.peer];if(peers[c.peer]&&peers[c.peer].c===c){delete peers[c.peer];render()}};
 c.on('close',x);c.on('error',x);
}
function onData(c,d){
 const P=peers[c.peer];if(!P||P.c!==c)return;
 if(d.t==='hi'){P.name=d.name||'?';c.send({t:'peers',l:Object.keys(peers).filter(i=>i!==c.peer)});render()}
 else if(d.t==='peers')d.l.forEach(connect);
 else if(d.t==='m')addMsg(d.g?'g':'p:'+P.name,{name:P.name,text:d.text,ts:d.ts});
 else if(d.t==='fm')files[d.id]={m:d,ch:[],got:0};
 else if(d.t==='fc'){const f=files[d.id];if(f){f.ch.push(d.d);f.got+=d.d.byteLength||d.d.size||0;prog('Receiving '+f.m.n,Math.min(1,f.got/f.m.s))}}
 else if(d.t==='fe'){const f=files[d.id];if(!f)return;delete files[d.id];prog();const m=f.m;
  addMsg(m.g?'g':'p:'+P.name,{name:P.name,ts:m.ts,f:{n:m.n,s:m.s,y:m.y||'',u:URL.createObjectURL(new Blob(f.ch,{type:m.y||''}))}})}
}

/* ---------- chat ---------- */
function prog(l,p){const g=$('pg');if(!l){g.style.display='none';return}g.style.display='block';g.children[0].textContent=l+' '+Math.round(p*100)+'%';g.children[1].firstElementChild.style.width=p*100+'%'}
const key=()=>cur==='g'?'g':'p:'+(peers[cur]?peers[cur].name:'');
const targets=()=>cur==='g'?Object.values(peers).map(p=>p.c):(peers[cur]?[peers[cur].c]:[]);
function render(){
 const ids=Object.keys(peers),n=ids.length;
 $('scan').style.display=n?'none':'flex';$('chat').style.display=n?'flex':'none';
 if(!n)return;
 if(n===1)cur=ids[0];else if(cur!=='g'&&!peers[cur])cur='g';
 showMsgs();
 const s=$('sel');s.innerHTML='';
 const add=(v,t)=>{const k=v==='g'?'g':'p:'+peers[v].name;const o=el('option',0,t+(unread.has(k)?' •':''));o.value=v;s.appendChild(o)};
 if(n>1)add('g','Group chat');ids.forEach(i=>add(i,peers[i].name));
 s.value=cur;
 $('sub').textContent=cur==='g'?[myName,...ids.map(i=>peers[i].name)].join(', ')+' - groupchat':'';
}
function showMsgs(){const b=$('msgs'),k=key();unread.delete(k);b.innerHTML='';hist.filter(m=>m.k===k).forEach(m=>b.appendChild(bubble(m)));b.scrollTop=b.scrollHeight}
function bubble(m){
 const b=el('div','b '+(m.me?'me':'ot'));
 if(!m.me&&m.k==='g')b.appendChild(el('small',0,m.name));
 if(m.f){const f=m.f;
  if(/^image/.test(f.y)){const i=el('img');i.src=f.u;b.appendChild(i)}
  else if(/^video/.test(f.y)){const v=el('video');v.src=f.u;v.controls=true;v.playsInline=true;b.appendChild(v)}
  b.appendChild(el('div',0,f.n+' ('+fmt(f.s)+')'));
  const r=el('div','fb'),o=el('a',0,'Open'),d=el('a',0,'Download');o.href=d.href=f.u;o.target='_blank';d.download=f.n;r.append(o,d);b.appendChild(r);
 }else b.appendChild(document.createTextNode(m.text));
 return b}
function addMsg(k,m){m.k=k;hist.push(m);save();
 if(k===key()){const b=$('msgs');b.appendChild(bubble(m));b.scrollTop=b.scrollHeight}else{unread.add(k);render()}}
function sendText(){
 const t=$('inp').value.trim();if(!t)return;
 const m={t:'m',g:cur==='g'?1:0,text:t,ts:Date.now()};
 targets().forEach(c=>{try{c.send(m)}catch(e){}});
 addMsg(key(),{me:1,name:myName,text:t,ts:m.ts});$('inp').value='';$('inp').style.height='';
}
async function sendFiles(list){
 const T=targets(),g=cur==='g'?1:0,k=key();
 for(const f of list){
  const id=Math.random().toString(36).slice(2),ts=Date.now(),y=f.type||'';
  addMsg(k,{me:1,name:myName,ts,f:{n:f.name,s:f.size,y,u:URL.createObjectURL(f)}});
  T.forEach(c=>c.send({t:'fm',id,n:f.name,s:f.size,y,g,ts}));
  for(let o=0;o<f.size;o+=65536){
   const d=await f.slice(o,o+65536).arrayBuffer();prog('Sending '+f.name,Math.min(1,(o+65536)/f.size));
   for(const c of T){while(c.dataChannel&&c.dataChannel.bufferedAmount>4e6)await sleep(25);try{c.send({t:'fc',id,d})}catch(e){}}
  }
  T.forEach(c=>{try{c.send({t:'fe',id})}catch(e){}});prog();
 }}
$('sel').onchange=e=>{cur=e.target.value;render()};
$('snd').onclick=sendText;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();sendText()}});
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(110,e.target.scrollHeight)+'px'});
$('inp').addEventListener('focus',()=>setTimeout(fit,350));
$('att').onclick=()=>$('fi').click();
$('fi').onchange=e=>{sendFiles([...e.target.files]);e.target.value=''};

/* ---------- calls ---------- */
const vc=f=>({facingMode:f,width:{ideal:720},height:{ideal:1280},aspectRatio:{ideal:9/16}});
async function media(v){try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:v?vc('user'):false})}catch(e){alert('Camera/mic unavailable: '+e.message)}}
async function startCall(v){
 if(call)return;
 const ids=cur==='g'?Object.keys(peers).slice(0,3):[cur];if(!ids.length)return;
 const s=await media(v);if(!s)return;
 beginCall(Math.random().toString(36).slice(2),v,s,[main.id,...ids]);
 ids.forEach(dial);
}
function beginCall(gid,video,s,members){
 call={gid,video,stream:s,calls:{},streams:{},members,facing:'user',rec:null};
 $('call').style.display='flex';$('bc').style.display=$('bf').style.display=$('lv').style.display=video?'':'none';
 $('lv').srcObject=s;$('bm').textContent='🎤';$('bc').textContent='📷';$('br').classList.remove('on');
}
function dial(id){hook(main.call(id,call.stream,{metadata:{gid:call.gid,video:call.video,members:call.members,from:myName}}),id)}
function hook(c,id){call.calls[id]=c;c.on('stream',s=>addTile(id,s));const x=()=>dropCall(id);c.on('close',x);c.on('error',x)}
function answer(c){c.answer(call.stream);hook(c,c.peer)}
function onCall(c){
 const m=c.metadata||{};
 if(call){if(call.gid===m.gid)answer(c);else c.close();return}
 const I=inc[m.gid]=inc[m.gid]||{calls:[],m};I.calls.push(c);
 c.on('close',()=>{const J=inc[m.gid];if(J){J.calls=J.calls.filter(x=>x!==c);if(!J.calls.length){delete inc[m.gid];$('ring').style.display='none'}}});
 if(I.calls.length===1)ring(m.gid);
}
function ring(g){
 const m=inc[g].m;
 $('rt').textContent=m.from+' is '+(m.video?'video':'voice')+' calling'+(m.members.length>2?' (group)':'');
 $('ring').style.display='flex';
 $('ra').onclick=async()=>{
  $('ring').style.display='none';const I=inc[g];if(!I)return;delete inc[g];
  const s=await media(m.video);if(!s){I.calls.forEach(c=>c.close());return}
  beginCall(g,m.video,s,m.members);I.calls.forEach(answer);
  m.members.forEach(i=>{if(i!==main.id&&!call.calls[i]&&main.id<i&&peers[i])dial(i)});
 };
 $('rd').onclick=()=>{$('ring').style.display='none';const I=inc[g];if(I){delete inc[g];I.calls.forEach(c=>c.close())}};
}
function addTile(id,s){
 if(!call)return;call.streams[id]=s;
 let t=$('t'+id);
 if(!t){t=el('div','tile');t.id='t'+id;const v=el('video');v.autoplay=v.playsInline=true;t.append(v,el('span','nm',(peers[id]||{}).name||''));$('grid').appendChild(t)}
 t.firstChild.srcObject=s;lay();
}
const lay=()=>$('grid').style.setProperty('--n',Math.min(2,Math.max(1,$('grid').children.length)));
function dropCall(id){
 if(!call)return;delete call.calls[id];delete call.streams[id];
 const t=$('t'+id);t&&t.remove();lay();
 if(!Object.keys(call.calls).length)hang();
}
function hang(){
 if(!call)return;const c=call;call=null;
 if(c.rec)c.rec.stop();
 Object.values(c.calls).forEach(x=>{try{x.close()}catch(e){}});
 c.stream.getTracks().forEach(t=>t.stop());
 $('call').style.display='none';$('grid').innerHTML='';
}
$('vc').onclick=()=>startCall(false);$('vv').onclick=()=>startCall(true);$('bh').onclick=hang;
$('bm').onclick=()=>{const t=call.stream.getAudioTracks(),on=!t[0].enabled;t.forEach(x=>x.enabled=on);$('bm').textContent=on?'🎤':'🔇'};
$('bc').onclick=()=>{const t=call.stream.getVideoTracks(),on=!t[0].enabled;t.forEach(x=>x.enabled=on);$('bc').textContent=on?'📷':'🚫'};
$('bf').onclick=async()=>{
 try{
  const c=call,old=c.stream.getVideoTracks()[0],en=old.enabled;c.facing=c.facing==='user'?'environment':'user';
  old.stop();
  const nt=(await navigator.mediaDevices.getUserMedia({video:vc(c.facing)})).getVideoTracks()[0];nt.enabled=en;
  c.stream.removeTrack(old);c.stream.addTrack(nt);
  Object.values(c.calls).forEach(x=>{const s=x.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video');s&&s.replaceTrack(nt)});
  $('lv').style.transform=c.facing==='user'?'scaleX(-1)':'';
 }catch(e){alert('Cannot switch camera')}
};
$('br').onclick=()=>{
 const c=call;if(c.rec){c.rec.stop();return}
 const ac=new AudioContext(),d=ac.createMediaStreamDestination(),vt=[];
 [c.stream,...Object.values(c.streams)].forEach(s=>{
  if(s.getAudioTracks().length)ac.createMediaStreamSource(s).connect(d);
  if(s!==c.stream&&!vt.length&&s.getVideoTracks()[0])vt.push(s.getVideoTracks()[0]);
 });
 const r=new MediaRecorder(new MediaStream([...d.stream.getAudioTracks(),...vt])),ch=[];
 r.ondataavailable=e=>e.data.size&&ch.push(e.data);
 r.onstop=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob(ch,{type:r.mimeType}));a.download='recording-'+Date.now()+'.webm';a.click();ac.close();c.rec=null;$('br').classList.remove('on')};
 r.start();c.rec=r;$('br').classList.add('on');
};

/* ---------- boot ---------- */
function askName(){
 $('nm').style.display='flex';
 const go=()=>{const v=$('ni').value.trim();if(!v)return;myName=v;localStorage.setItem('pc_name',v);$('nm').style.display='none';start()};
 $('go').onclick=go;$('ni').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
myName?start():askName();
</script></body></html>
